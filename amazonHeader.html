<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./amazon.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Style Header</title>
</head>

<body>

    <header class="header">

        <div class="logo">
            amazon.in
           
        </div>

        
        <div class="location">
            <small>Delivering to New Delhi 110002</small>
            <b> Update location</b>
        </div>

        
        <div class="search">

            <select>
                <option>All</option>
                <option>Books</option>
                <option>Electronics</option>
      x          <option>Clothing</option>
            </select>

            <input type="text" placeholder="Search Amazon.in">

            <button>🔍</button>

        </div>

        <!-- Language -->
        <div class="language">
            🇮🇳 EN
        </div>

        <!-- Account -->
        <div class="account">
            <small>Hello, sign in</small>
            <b>Account & Lists</b>
        </div>

        <!-- Orders -->
        <div class="orders">
            <small>Returns</small>
            <b>& Orders</b>
        </div>

    </header>

</body>
</html>
